<!DOCTYPE html>
<html>
<head>
    <title>ROS Topic Test</title>
    <script src="https://static.robotwebtools.org/roslibjs/current/roslib.min.js"></script>
</head>
<body>
    <h1>ROS Topic Test</h1>
    <div id="status">Connecting...</div>
    <div id="data"></div>
    
    <script>
        var ros = new ROSLIB.Ros({
            url: 'ws://localhost:9090'
        });

        ros.on('connection', function() {
            document.getElementById('status').innerHTML = '✅ Connected to ROS';
            console.log('Connected to websocket server.');
            
            // Subscribe to ultrasonic front
            var usFront = new ROSLIB.Topic({
                ros: ros,
                name: '/ultrasonic/front',
                messageType: 'sensor_msgs/Range'
            });

            usFront.subscribe(function(message) {
                console.log('Ultrasonic front:', message.range);
                document.getElementById('data').innerHTML = 
                    'Ultrasonic Front: ' + (message.range * 100).toFixed(2) + ' cm';
            });
        });

        ros.on('error', function(error) {
            document.getElementById('status').innerHTML = '❌ Error: ' + error;
            console.log('Error connecting to websocket server: ', error);
        });

        ros.on('close', function() {
            document.getElementById('status').innerHTML = '⚠️  Connection closed';
            console.log('Connection to websocket server closed.');
        });
    </script>
</body>
</html>
